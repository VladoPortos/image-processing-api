services:
  image-processing-api:
    image: image-processing-api:local
    build:
      context: .
      target: ai
    container_name: image-processing-api
    volumes:
      - ./data:/data
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8078:8000"
    restart: unless-stopped
    environment:
      - IMAGE_DATA_DIR=/data
      - IMAGE_WORKERS=2
      - IMAGE_API_ENABLE_CLASSIFIER=false
      - RAIW_CLASSIFY_WEIGHTS=/models/photo-classifier
      - HF_HUB_OFFLINE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
